# =====================================================================
# personapi-dotnet - despliegue con Docker Compose
#   sqlserver : Microsoft SQL Server 2022 (edición Express)
#   db-init   : ejecuta db/DDL.sql y db/DML.sql una vez que SQL Server está listo
#   app       : monolito ASP.NET Core 7 (MVC + API REST + Swagger)
#
# Uso:   docker compose up -d --build
# Web:   http://localhost:8080
# API:   http://localhost:8080/swagger
# =====================================================================

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: personapi-sqlserver
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-Lab1-Persona2026}"
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
          || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: personapi-db-init
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SA_PASSWORD: "${SA_PASSWORD:-Lab1-Persona2026}"
    volumes:
      - ./db:/scripts:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then SQLCMD="/opt/mssql-tools18/bin/sqlcmd -C"; else SQLCMD="/opt/mssql-tools/bin/sqlcmd"; fi
        echo "Ejecutando DDL..."
        $$SQLCMD -S sqlserver -U sa -P "$$SA_PASSWORD" -b -i /scripts/DDL.sql || exit 1
        echo "Ejecutando DML..."
        $$SQLCMD -S sqlserver -U sa -P "$$SA_PASSWORD" -b -i /scripts/DML.sql || exit 1
        echo "Base de datos persona_db lista."
    restart: "no"

  app:
    build:
      context: ./personapi-dotnet
      dockerfile: Dockerfile
    image: personapi-dotnet:1.0.0
    container_name: personapi-app
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__PersonaDb: "Server=sqlserver,1433;Database=persona_db;User Id=sa;Password=${SA_PASSWORD:-Lab1-Persona2026};TrustServerCertificate=True"
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  sqlserver-data:
